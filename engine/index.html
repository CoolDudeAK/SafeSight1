<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SafeSightAI+ Engine Demo</title>
<style>
  body{font-family:Arial, sans-serif; background:#f4f6f9; color:#1b2430; margin:0; padding:24px;}
  .wrap{max-width:640px; margin:0 auto;}
  h1{color:#1F497D; font-size:20px;}
  .card{background:#fff; border:1px solid #e1e6ec; border-radius:10px; padding:18px; margin-bottom:16px;}
  textarea, input, select{width:100%; padding:9px 11px; border:1px solid #e1e6ec; border-radius:6px; font-size:14px; box-sizing:border-box; margin-bottom:10px;}
  button{background:#E8651A; color:#fff; border:none; border-radius:6px; padding:10px 16px; font-weight:700; cursor:pointer;}
  button.secondary{background:#1F497D;}
  .badge{display:inline-block; padding:3px 9px; border-radius:20px; font-size:11px; font-weight:800; text-transform:uppercase;}
  .Fatal{background:#f6dede; color:#3a0d0d;}
  .Dangerous{background:#fbe1e2; color:#c0242c;}
  .High{background:#fdead9; color:#e8651a;}
  .Medium{background:#fdf3d0; color:#8a6c00;}
  .Low{background:#e2f3e6; color:#2f8f4e;}
  .analysis-log{list-style:none; padding:0; margin:10px 0; font-size:12.5px; color:#5b6570;}
  .analysis-log li{padding:4px 0; border-bottom:1px dashed #e1e6ec;}
  .analysis-log li:last-child{border-bottom:none;}
  .steps-list{list-style:none; padding:0; margin:10px 0; font-size:13.5px;}
  .steps-list li{padding:5px 0;}
  .ticket-row{border-bottom:1px solid #e1e6ec; padding:10px 0; font-size:13px;}
  .ticket-row:last-child{border-bottom:none;}
</style>
</head>
<body>
<div class="wrap">
  <h1>🦺 SafeSightAI+ — Engine Demo</h1>

  <div class="card">
    <label>Describe the hazard you observed</label>
    <textarea id="reportText" rows="3" placeholder="e.g. worker without helmet near the edge on platform 1"></textarea>
    <label>Zone</label>
    <input id="zoneInput" placeholder="e.g. Platform 1 - North" value="Platform 1 - North">
    <label>Reporter name</label>
    <input id="reporterInput" placeholder="e.g. Manoj Yadav" value="Manoj Yadav">
    <button id="analyzeBtn">Analyze &amp; Create Ticket</button>
  </div>

  <div id="resultArea"></div>

  <div class="card">
    <h2 style="font-size:15px; color:#1F497D; margin-top:0;">All Tickets</h2>
    <div id="ticketList"></div>
  </div>
</div>

<!-- Load the engine BEFORE this page's own script -->
<script src="safesightai-engine.js"></script>
<script>
  document.getElementById('analyzeBtn').onclick = function () {
    const text = document.getElementById('reportText').value;
    const zone = document.getElementById('zoneInput').value;
    const reporter = document.getElementById('reporterInput').value;

    if (!text.trim()) { alert('Please describe the hazard first.'); return; }

    // Step 1: classify the text
    const result = classifyHazard(text);

    // Step 2: save it as a ticket
    const ticket = createTicket(result, { zone, reporter });

    // Step 3: show the result card
    renderResultCard(ticket);

    // Step 4: refresh the ticket list below
    renderTicketList();
  };

  function renderResultCard(ticket) {
    const area = document.getElementById('resultArea');
    area.innerHTML = `
      <div class="card">
        <div><span class="badge ${ticket.tier}">${ticket.tier}</span> ${ticket.icon} <b>${ticket.label}</b> — ${ticket.confidence}% confidence</div>
        <p style="font-size:12px; font-weight:700; color:#1F497D; margin:12px 0 2px;">Why the AI decided this:</p>
        ${renderAnalysisLog(ticket.analysisLog)}
        <p style="font-size:12px; font-weight:700; color:#1F497D; margin:12px 0 2px;">Suggested response:</p>
        <ul class="steps-list">
          ${ticket.solutionSteps.map((s, i) => `
            <li>
              <label>
                <input type="checkbox" onchange="onStepToggle('${ticket.id}', ${i}, this.checked)">
                ${s}
              </label>
            </li>`).join('')}
        </ul>
      </div>`;
  }

  function onStepToggle(ticketId, stepIndex, checked) {
    markStepDone(ticketId, stepIndex, checked);
    renderTicketList(); // status may have changed, refresh the list
  }

  function renderTicketList() {
    const list = document.getElementById('ticketList');
    const tickets = getAllTickets();
    if (!tickets.length) {
      list.innerHTML = '<p style="color:#5b6570; font-size:13px;">No tickets yet.</p>';
      return;
    }
    list.innerHTML = tickets.map(t => `
      <div class="ticket-row">
        <span class="badge ${t.tier}">${t.tier}</span>
        ${t.icon} <b>${t.label}</b> — ${t.zone} — status: <b>${t.status}</b>
        <button class="secondary" style="float:right; padding:4px 10px; font-size:11px;"
          onclick="updateTicketStatus('${t.id}', 'Resolved'); renderTicketList();">Mark Resolved</button>
      </div>`).join('');
  }

  // Show any tickets already saved from a previous visit
  renderTicketList();
</script>
</body>
</html>
