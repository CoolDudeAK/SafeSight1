<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SafeSightAI+ | Muzaffarpur Junction Redevelopment</title>
<style>
  :root{
    --navy:#1F497D;
    --navy-dark:#163a63;
    --orange:#E8651A;
    --orange-dark:#c9540f;
    --bg:#f4f6f9;
    --card:#ffffff;
    --text:#1b2430;
    --text-dim:#5b6570;
    --border:#e1e6ec;
    --fatal:#3a0d0d;
    --fatal-bg:#f6dede;
    --dangerous:#c0242c;
    --dangerous-bg:#fbe1e2;
    --high:#e8651a;
    --high-bg:#fdead9;
    --medium:#d9a400;
    --medium-bg:#fdf3d0;
    --low:#2f8f4e;
    --low-bg:#e2f3e6;
    --shadow: 0 1px 3px rgba(20,30,50,.08), 0 1px 2px rgba(20,30,50,.06);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#11161d; --card:#1a2129; --text:#e8ecf1; --text-dim:#9aa6b2; --border:#2a333e;
    }
  }
  :root[data-theme="dark"]{
    --bg:#11161d; --card:#1a2129; --text:#e8ecf1; --text-dim:#9aa6b2; --border:#2a333e;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:Arial, Helvetica, sans-serif;}
  #app{min-height:100vh;display:flex;flex-direction:column;}
  a{color:inherit;}
  button{font-family:inherit;cursor:pointer;}
  .btn{border:none;border-radius:6px;padding:10px 16px;font-size:14px;font-weight:600;transition:opacity .15s;}
  .btn:active{opacity:.75;}
  .btn-primary{background:var(--navy);color:#fff;}
  .btn-orange{background:var(--orange);color:#fff;}
  .btn-outline{background:transparent;border:1px solid var(--border);color:var(--text);}
  .btn-ghost{background:transparent;color:var(--navy);}
  .btn-sm{padding:6px 10px;font-size:12.5px;border-radius:5px;}
  .btn:disabled{opacity:.45;cursor:not-allowed;}
  input,textarea,select{font-family:inherit;font-size:14px;padding:9px 11px;border:1px solid var(--border);border-radius:6px;background:var(--card);color:var(--text);width:100%;}
  input:focus,textarea:focus,select:focus{outline:2px solid var(--navy);outline-offset:1px;}
  label{font-size:12.5px;font-weight:600;color:var(--text-dim);display:block;margin-bottom:4px;}
  .field{margin-bottom:12px;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);}
  .container{max-width:1280px;margin:0 auto;padding:0 20px;width:100%;}
  .topbar{background:var(--navy);color:#fff;padding:12px 0;}
  .topbar .container{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand-badge{width:38px;height:38px;border-radius:9px;background:var(--orange);display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0;}
  .brand-text h1{font-size:16px;margin:0;letter-spacing:.3px;}
  .brand-text p{font-size:10.5px;margin:0;color:#cdd9ea;letter-spacing:.5px;text-transform:uppercase;}
  .nav-user{display:flex;align-items:center;gap:10px;font-size:13px;flex-wrap:wrap;}
  .role-pill{background:rgba(255,255,255,.15);padding:4px 10px;border-radius:20px;font-size:11.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;}
  .tabbar{background:#193f6b;overflow-x:auto;}
  .tabbar .container{display:flex;gap:4px;padding-top:0;padding-bottom:0;}
  .tab{padding:12px 16px;font-size:13px;color:#cdd9ea;font-weight:600;white-space:nowrap;border-bottom:3px solid transparent;background:transparent;}
  .tab.active{color:#fff;border-bottom-color:var(--orange);}
  main{flex:1;padding:22px 0 60px;}
  .grid{display:grid;gap:16px;}
  .grid-2{grid-template-columns:repeat(2,1fr);}
  .grid-3{grid-template-columns:repeat(3,1fr);}
  .grid-4{grid-template-columns:repeat(4,1fr);}
  @media (max-width:900px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr 1fr;}}
  @media (max-width:600px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr;}}
  .section-title{font-size:15px;font-weight:800;color:var(--navy);margin:0 0 12px;display:flex;align-items:center;gap:8px;}
  .pad{padding:18px;}
  .banner{border-radius:12px;padding:22px;display:flex;align-items:center;gap:16px;color:#fff;}
  .banner.clear{background:linear-gradient(135deg,#2f8f4e,#276e3d);}
  .banner.control{background:linear-gradient(135deg,#d9a400,#b58200);}
  .banner.alert{background:linear-gradient(135deg,#c0242c,#8f171d);}
  .banner .icon{font-size:38px;}
  .banner h2{margin:0 0 4px;font-size:22px;letter-spacing:.5px;}
  .banner p{margin:0;font-size:13.5px;opacity:.92;}
  .badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:800;letter-spacing:.3px;text-transform:uppercase;}
  .badge-fatal{background:var(--fatal-bg);color:var(--fatal);}
  .badge-dangerous{background:var(--dangerous-bg);color:var(--dangerous);}
  .badge-high{background:var(--high-bg);color:var(--high);}
  .badge-medium{background:var(--medium-bg);color:#8a6c00;}
  .badge-low{background:var(--low-bg);color:var(--low);}
  .badge-status{background:#e8edf3;color:var(--navy);}
  .badge-status.inprogress{background:#fdf0dd;color:var(--orange-dark);}
  .badge-status.verified{background:#dfe9fb;color:#25508f;}
  .badge-status.resolved{background:var(--low-bg);color:var(--low);}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--border);}
  th{color:var(--text-dim);font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;font-weight:700;}
  tr:hover td{background:rgba(31,73,125,.03);}
  .table-wrap{overflow-x:auto;}
  .stat{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px;}
  .stat .num{font-size:26px;font-weight:800;color:var(--navy);}
  .stat .lbl{font-size:12px;color:var(--text-dim);margin-top:2px;}
  .stat.accent .num{color:var(--orange);}
  .modal-bg{position:fixed;inset:0;background:rgba(10,15,25,.55);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px;}
  .modal{background:var(--card);border-radius:12px;max-width:640px;width:100%;max-height:88vh;overflow-y:auto;padding:22px;}
  .modal h3{margin-top:0;color:var(--navy);}
  .close-x{float:right;background:none;border:none;font-size:20px;color:var(--text-dim);cursor:pointer;}
  .chip-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
  .chip{padding:8px 14px;border-radius:20px;border:1.5px solid var(--border);font-size:13px;font-weight:600;background:var(--card);color:var(--text);}
  .chip.active{background:var(--navy);border-color:var(--navy);color:#fff;}
  .steps-list{list-style:none;padding:0;margin:10px 0;}
  .steps-list li{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:13.5px;border-bottom:1px dashed var(--border);}
  .steps-list li:last-child{border-bottom:none;}
  .steps-list input{width:auto;}
  .steps-list .done{text-decoration:line-through;color:var(--text-dim);}
  .cam-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
  @media (max-width:800px){.cam-grid{grid-template-columns:repeat(2,1fr);}}
  @media (max-width:520px){.cam-grid{grid-template-columns:1fr;}}
  .cam-tile{background:#0d1622;border-radius:8px;overflow:hidden;position:relative;aspect-ratio:4/3;}
  .cam-tile canvas,.cam-tile video{width:100%;height:100%;object-fit:cover;display:block;}
  .cam-label{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,.75));color:#fff;font-size:11.5px;padding:14px 8px 6px;font-weight:600;}
  .cam-live-dot{position:absolute;top:8px;left:8px;background:#c0242c;color:#fff;font-size:10px;font-weight:800;padding:2px 7px;border-radius:10px;letter-spacing:.5px;}
  .empty{padding:40px 20px;text-align:center;color:var(--text-dim);}
  .empty .e-icon{font-size:36px;margin-bottom:8px;}
  .login-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:24px;background:
    radial-gradient(circle at 20% 20%, rgba(232,101,26,.08), transparent 40%),
    radial-gradient(circle at 80% 80%, rgba(31,73,125,.10), transparent 45%), var(--bg);}
  .login-card{max-width:460px;width:100%;padding:32px;}
  .role-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0 20px;}
  .role-btn{padding:16px 10px;border-radius:10px;border:2px solid var(--border);background:var(--card);text-align:center;font-weight:700;font-size:13.5px;color:var(--text);}
  .role-btn .r-icon{font-size:22px;display:block;margin-bottom:6px;}
  .role-btn.selected{border-color:var(--navy);background:#eef3fa;color:var(--navy);}
  .hint{font-size:11.5px;color:var(--text-dim);margin-top:10px;line-height:1.5;}
  .progress-bar{height:8px;background:var(--border);border-radius:6px;overflow:hidden;margin:10px 0;}
  .progress-bar > div{height:100%;background:var(--orange);transition:width .3s;}
  .upload-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
  .upload-tab{padding:8px 14px;border-radius:7px;border:1px solid var(--border);background:var(--card);font-size:13px;font-weight:600;color:var(--text-dim);}
  .upload-tab.active{background:var(--navy);color:#fff;border-color:var(--navy);}
  .result-card{border:1.5px solid var(--border);border-radius:10px;padding:14px;margin-top:12px;position:relative;}
  .result-card.fatal{border-color:var(--fatal);}
  .result-card.dangerous{border-color:var(--dangerous);}
  .result-card.high{border-color:var(--high);}
  .result-card.medium{border-color:var(--medium);}
  .result-card.low{border-color:var(--low);}
  .sep-bar{display:flex;gap:10px;margin:8px 0;font-size:11.5px;color:var(--text-dim);}
  .sep-bar b{color:var(--text);}
  details{margin-top:8px;}
  details summary{cursor:pointer;font-size:12px;color:var(--navy);font-weight:700;}
  .footer-note{margin-top:30px;padding:14px 18px;background:#eef3fa;border-radius:10px;font-size:12px;color:var(--text-dim);line-height:1.6;}
  .toast{position:fixed;bottom:20px;right:20px;background:var(--navy);color:#fff;padding:12px 18px;border-radius:8px;font-size:13.5px;box-shadow:var(--shadow);z-index:200;max-width:320px;}
  .flexrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .spacer{flex:1;}
  video.preview,img.preview{max-width:100%;border-radius:8px;margin:10px 0;max-height:220px;object-fit:cover;}
  .search-row{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
  .search-row input,.search-row select{width:auto;flex:1;min-width:140px;}
  .kbd-note{font-size:11px;color:var(--text-dim);}
  ::-webkit-scrollbar{height:8px;width:8px;}
  ::-webkit-scrollbar-thumb{background:#c3ccd6;border-radius:4px;}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============================== DATA ============================== */
const SITE_NAME = "Muzaffarpur Junction Redevelopment Project, Bihar";
const SITE_SHORT = "Muzaffarpur Jn. Redevelopment (Indian Railways)";

const ZONES = ["Platform 1 – North","Platform 2 – South","Foundation Pit – East","Foundation Pit – West",
  "Scaffolding Bay 3","Cable Trench – Yard","Main Concourse","FOB – Overbridge Site"];

const TIERS = [
  {id:"Fatal", label:"Fatal", cls:"fatal", desc:"Immediate death/life-threatening risk if unaddressed"},
  {id:"Dangerous", label:"Dangerous", cls:"dangerous", desc:"Serious injury highly likely — urgent action"},
  {id:"High", label:"High", cls:"high", desc:"Significant injury possible — prompt action needed"},
  {id:"Medium", label:"Medium", cls:"medium", desc:"Moderate injury possible — scheduled action"},
  {id:"Low", label:"Low", cls:"low", desc:"Minor risk — routine housekeeping"}
];
const TIER_ORDER = {Fatal:0,Dangerous:1,High:2,Medium:3,Low:4};
const TIER_SCORE_RANGE = {Fatal:[100,125],Dangerous:[65,99],High:[40,64],Medium:[18,39],Low:[3,17]};

const HAZARD_TYPES = [
  {id:"slip_trip", label:"Slip & Trip / Debris Fall", icon:"🪵",
    keywords:["debris","slip","trip","wet","spill","uneven"],
    baseTier:"Low", escalate:[{to:"Medium",chance:.35,note:"high-footfall walkway"}],
    solution:["Clear debris immediately","Barricade the area","Assign housekeeping crew","Re-inspect in 24h"]},
  {id:"exposed_rebar", label:"Exposed Reinforcement", icon:"⚠️",
    keywords:["rebar","reinforcement","exposed rod","column"],
    baseTier:"High", escalate:[{to:"Medium",chance:.4,note:"low-traffic area, capped priority lowered"}],
    solution:["Cap exposed rebar","Barricade the zone","Notify structural engineer"]},
  {id:"live_wire", label:"Unearthed Live Wire", icon:"⚡",
    keywords:["wire","cable","electric","frayed","conduit"],
    baseTier:"Dangerous", escalate:[{to:"Fatal",chance:.4,note:"near standing water/mud — escalated"}],
    solution:["Isolate power immediately","Cordon off the area","Notify electrical safety officer"]},
  {id:"ppe_violation", label:"PPE Kit Violation", icon:"🦺",
    keywords:["helmet","ppe","vest","gloves","boots","no helmet"],
    baseTier:"Medium", escalate:[],
    solution:["Issue on-site warning","Provide PPE on the spot","Log worker ID","Flag for retraining"]},
  {id:"no_harness", label:"No Harness (Work at Height)", icon:"🪢",
    keywords:["harness","height","edge","fall arrest"],
    baseTier:"Dangerous", escalate:[],
    solution:["Halt work at height","Issue harness","Verify anchor point","Supervisor sign-off"]},
  {id:"scaffolding_risk", label:"Scaffolding Risk", icon:"🏗️",
    keywords:["scaffold","bracing","pole","platform overload"],
    baseTier:"High", escalate:[{to:"Dangerous",chance:.35,note:"structural joint/bracing issue"},
                                {to:"Fatal",chance:.15,note:"severe misalignment + active load — escalated"}],
    solution:["Stop scaffold use","Engineer inspection","Realign / reinforce","Re-certify before reuse"]}
];
function hz(id){ return HAZARD_TYPES.find(h=>h.id===id); }

const DOC_SECTIONS = ["JSA","TPR","Clearances","Licenses","Other"];

const DEMO_USERS = {
  admin:    {username:"admin",     password:"admin123", name:"R. K. Sinha",  role:"admin"},
  associate:{username:"associate", password:"site123",  name:"Manoj Yadav",  role:"associate"},
  member:   {username:"member",    password:"work123",  name:"Suresh Paswan",role:"member"}
};
const ROLE_META = {
  admin:{label:"Head Safety Officer", icon:"🛡️"},
  associate:{label:"Site Officer", icon:"👷‍♂️"},
  member:{label:"Workman", icon:"🧰"},
  visitor:{label:"General Public", icon:"👁️"}
};

/* ========================== STATE / STORAGE ========================= */
const STORE_KEY = "ssai_plus_state_v1";
let state = null;

function seedState(){
  const now = Date.now();
  const mk = (offsetHrs)=> new Date(now - offsetHrs*3600*1000).toISOString();
  const seedHazards = [
    buildHazard("live_wire", "associate", "Manoj Yadav", "Cable Trench – Yard", mk(2), true, "near standing water/mud — escalated"),
    buildHazard("scaffolding_risk", "associate", "Manoj Yadav", "Scaffolding Bay 3", mk(5), true, "structural joint/bracing issue"),
    buildHazard("ppe_violation", "member", "Suresh Paswan", "Platform 1 – North", mk(7)),
    buildHazard("exposed_rebar", "associate", "Manoj Yadav", "Foundation Pit – East", mk(20)),
  ];
  const resolvedHazards = [
    (()=>{ const h = buildHazard("slip_trip","member","Suresh Paswan","Main Concourse", mk(50));
      h.assignedSolution = h.solution[0]; h.status="Resolved"; h.resolvedAt = mk(30);
      h.verifiedBy = "Automated Device Verification";
      h.resolutionLog = [
        {solution:h.solution[0], action:"assigned", by:"R. K. Sinha", note:null, ts:mk(48)},
        {solution:h.solution[0], action:"implemented", by:"Suresh Paswan", note:null, ts:mk(35)},
        {solution:h.solution[0], action:"verified", by:"Automated Device Verification", note:null, ts:mk(30)}
      ];
      return h; })(),
    (()=>{ const h = buildHazard("no_harness","associate","Manoj Yadav","FOB – Overbridge Site", mk(90));
      h.assignedSolution = h.solution[0]; h.status="Resolved"; h.resolvedAt = mk(70);
      h.verifiedBy = "Automated Device Verification";
      h.resolutionLog = [
        {solution:h.solution[0], action:"assigned", by:"R. K. Sinha", note:null, ts:mk(85)},
        {solution:h.solution[0], action:"implemented", by:"Manoj Yadav", note:null, ts:mk(75)},
        {solution:h.solution[0], action:"verified", by:"Automated Device Verification", note:null, ts:mk(70)}
      ];
      return h; })(),
  ];

  // Example: already Assigned by the admin, awaiting the Site Officer's response
  seedHazards[0].status = "Assigned";
  seedHazards[0].assignedSolution = seedHazards[0].solution[0];
  seedHazards[0].assignedNote = "Crew dispatched, ETA 20 min";
  seedHazards[0].resolutionLog = [
    {solution:seedHazards[0].solution[0], action:"assigned", by:"R. K. Sinha", note:"Crew dispatched, ETA 20 min", ts:mk(2)}
  ];

  // Example: mid-loop — Site Officer declined the first solution, awaiting re-assignment
  seedHazards[1].status = "Pending Re-assignment";
  seedHazards[1].declineReason = "Crane required to fully halt scaffold use — not available until tomorrow.";
  seedHazards[1].resolutionLog = [
    {solution:seedHazards[1].solution[0], action:"assigned", by:"R. K. Sinha", note:null, ts:mk(6)},
    {solution:seedHazards[1].solution[0], action:"declined", by:"Manoj Yadav", reason:"Crane required to fully halt scaffold use — not available until tomorrow.", ts:mk(5)}
  ];

  seedHazards[2].status = "Open";

  // Example: implemented, awaiting the independent device verification check
  seedHazards[3].status = "Implemented — Pending Device Verification";
  seedHazards[3].assignedSolution = seedHazards[3].solution[0];
  seedHazards[3].assignedNote = "Structural engineer confirmed cap fitting Tuesday";
  seedHazards[3].implementedAt = mk(1);
  seedHazards[3].implementedBy = "Manoj Yadav";
  seedHazards[3].resolutionLog = [
    {solution:seedHazards[3].solution[0], action:"assigned", by:"R. K. Sinha", note:"Structural engineer confirmed cap fitting Tuesday", ts:mk(18)},
    {solution:seedHazards[3].solution[0], action:"implemented", by:"Manoj Yadav", note:null, ts:mk(1)}
  ];

  return {
    currentUser: null,
    view: "landing",
    subview: null,
    hazards: [...seedHazards, ...resolvedHazards],
    documents: [
      {id:uid(), section:"JSA", filename:"JSA_Foundation_Pit_East.pdf", uploader:"Manoj Yadav", status:"Verified", reason:"", ts:mk(120)},
      {id:uid(), section:"TPR", filename:"TPR_Scaffolding_Bay3.pdf", uploader:"Manoj Yadav", status:"Pending Review", reason:"", ts:mk(10)},
      {id:uid(), section:"Clearances", filename:"Electrical_Clearance_Yard.pdf", uploader:"Manoj Yadav", status:"Rejected", reason:"Signature page missing", ts:mk(200)},
      {id:uid(), section:"Licenses", filename:"Crane_Operator_License.pdf", uploader:"Manoj Yadav", status:"Pending Review", reason:"", ts:mk(3)},
    ]
  };
}

function loadState(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){ console.warn("state load failed", e); }
  return seedState();
}
function saveState(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }
  catch(e){ console.warn("state save failed", e); }
}

/* ============================== HELPERS ============================= */
function uid(){ return Math.random().toString(36).slice(2,10); }
function randInt(a,b){ return Math.floor(Math.random()*(b-a+1))+a; }
function pick(arr){ return arr[randInt(0,arr.length-1)]; }
function fmtTime(iso){
  const d = new Date(iso);
  return d.toLocaleString('en-IN', {day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit'});
}
function esc(s){ return (s||"").toString().replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function scoreToSEP(tier){
  const [lo,hi] = TIER_SCORE_RANGE[tier];
  for(let i=0;i<60;i++){
    const s=randInt(1,5), e=randInt(1,5), p=randInt(1,5), sc=s*e*p;
    if(sc>=lo && sc<=hi) return {s,e,p,score:sc};
  }
  const s=randInt(1,5), e=randInt(1,5), p=randInt(1,5);
  return {s,e,p,score:s*e*p};
}

function resolveTier(hazardType, forceEscalate){
  const def = hz(hazardType);
  let tier = def.baseTier;
  let note = null;
  if(forceEscalate && def.escalate.length){
    const opt = def.escalate[def.escalate.length-1];
    tier = opt.to; note = opt.note;
  } else {
    for(const opt of def.escalate){
      if(Math.random() < opt.chance){ tier = opt.to; note = opt.note; break; }
    }
  }
  return {tier, note};
}

function buildHazard(typeId, uploaderRole, uploaderName, zone, ts, forceEscalate, forceNote, confidenceOverride, clipTimestamp){
  const def = hz(typeId);
  const {tier, note} = resolveTier(typeId, forceEscalate);
  const finalNote = forceNote || note;
  const sep = scoreToSEP(tier);
  const confidence = confidenceOverride || randInt(note? 88:78, 96);
  return {
    id: uid(),
    type: typeId,
    label: def.label,
    icon: def.icon,
    confidence,
    tier,
    tierNote: finalNote,
    severity: sep.s, exposure: sep.e, probability: sep.p, rawScore: sep.score,
    zone: zone || pick(ZONES),
    ts: ts || new Date().toISOString(),
    uploader: uploaderName,
    uploaderRole,
    status: "Open",
    solution: def.solution.slice(),
    /* --- resolution-loop fields (Assign → Implement/Decline → Verify → Monitor) --- */
    assignedSolution: null,   // the one solution the admin has assigned
    assignedNote: null,       // admin's feasibility/resource note for the current assignment
    declineReason: null,      // most recent "cannot implement" reason or verification-failure reason, shown to admin
    monitoringNote: null,     // set when a monitoring sweep re-flags a resolved hazard
    resolutionLog: [],        // [{solution, action, by, reason/note, ts}] — full audit trail of the loop
    implementedAt: null,
    implementedBy: null,
    clipTimestamp: clipTimestamp || null,
    resolvedAt: null,
    verifiedBy: null
  };
}

function overallStatus(){
  const open = state.hazards.filter(h=>h.status!=="Resolved");
  if(open.some(h=>h.tier==="Fatal" || h.tier==="Dangerous")) return "alert";
  if(open.length>0) return "control";
  return "clear";
}
function statusMeta(s){
  return {
    clear:{label:"CLEAR", icon:"✅", desc:"No active hazards — site operating within normal safety parameters."},
    control:{label:"UNDER CONTROL", icon:"🟡", desc:"Active hazards identified and currently being managed by site safety teams."},
    alert:{label:"ALERT", icon:"🚨", desc:"Unresolved high-risk hazard on site — immediate safety action in progress."}
  }[s];
}

function toast(msg){
  const t = document.createElement('div');
  t.className='toast'; t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 2600);
}

/* Mock AI detection engine */
function detectFromHint(hint){
  const text = (hint||"").toLowerCase();
  const matches = HAZARD_TYPES.filter(h=>h.keywords.some(k=>text.includes(k)));
  if(matches.length) return matches.map(m=>m.id);
  // weighted random fallback — PPE & slip/trip most common on real sites
  const weights = [["slip_trip",3],["ppe_violation",3],["exposed_rebar",2],["scaffolding_risk",2],["no_harness",1],["live_wire",1]];
  const bag = [];
  weights.forEach(([id,w])=>{ for(let i=0;i<w;i++) bag.push(id); });
  return [pick(bag)];
}

function animateFeed(canvas, label, seed){
  const ctx = canvas.getContext('2d');
  let t=0;
  function draw(){
    if(!document.body.contains(canvas)) return;
    t+=1;
    ctx.fillStyle = `hsl(${(210+seed*20)%360},25%,${12+Math.sin(t/40+seed)*4}%)`;
    ctx.fillRect(0,0,320,240);
    ctx.strokeStyle='rgba(255,255,255,.08)';
    for(let i=0;i<6;i++){ ctx.beginPath(); ctx.moveTo(0,i*40); ctx.lineTo(320,i*40+Math.sin(t/30+i)*6); ctx.stroke(); }
    ctx.fillStyle='rgba(255,255,255,.55)';
    ctx.font='10px monospace';
    ctx.fillText(new Date().toLocaleTimeString(), 8, 232);
    ctx.fillStyle = seed%2===0 ? 'rgba(232,101,26,.5)' : 'rgba(80,150,255,.4)';
    const bx = 60+Math.sin(t/50+seed)*80, by=120+Math.cos(t/60+seed)*60;
    ctx.fillRect(bx,by,26,50);
    requestAnimationFrame(draw);
  }
  draw();
}
async function activateLiveCam(tile, btn){
  try{
    const stream = await navigator.mediaDevices.getUserMedia({video:true});
    tile.querySelector('canvas')?.remove();
    const video = document.createElement('video');
    video.autoplay=true; video.muted=true; video.playsInline=true;
    video.srcObject = stream;
    tile.insertBefore(video, tile.firstChild);
    const dot = el('div','cam-live-dot','● LIVE');
    tile.appendChild(dot);
    btn.remove();
  }catch(e){
    toast("Camera permission denied or unavailable in this browser.");
  }
}

function docStatusBadge(s){

}
window.reviewDoc = function(id, status){

/* ---------- Independent device verification (simulated, weighted random, same pattern as the mock AI engine) ---------- */
function runDeviceVerification(id){
  const h = state.hazards.find(x=>x.id===id);
  if(!h || h.status!=="Implemented — Pending Device Verification") return;
  const success = Math.random() < 0.78;
  if(success){
    h.resolutionLog.push({solution:h.assignedSolution, action:"verified", by:"Automated Device Verification", note:null, ts:new Date().toISOString()});
    h.verifiedBy = "Automated Device Verification";
    h.declineReason = null;
    h.status = "Resolved";
    h.resolvedAt = new Date().toISOString();
    toast(`Independent verification passed — "${h.label}" marked Resolved.`);
  } else {
    const reason = "Independent device check did not detect the fix (simulated mismatch).";
    h.resolutionLog.push({solution:h.assignedSolution, action:"verification_failed", by:"Automated Device Verification", reason, ts:new Date().toISOString()});
    h.declineReason = reason;
    h.status = "Verification Failed — Re-inspect";
    toast(`Independent verification failed for "${h.label}" — re-assignment needed.`);
  }
  render();
}

/* ---------- Continuous monitoring sweep (admin, manual trigger, simulated) ---------- */
function runMonitoringSweep(){
  const resolved = state.hazards.filter(h=>h.status==="Resolved");
  if(!resolved.length){ toast("No resolved hazards to check."); return; }
  let flagged = 0;
  resolved.forEach(h=>{
    if(Math.random() < 0.15){
      flagged++;
      const reason = "Previously resolved solution no longer detected.";
      h.resolutionLog.push({solution:h.assignedSolution, action:"monitoring_flagged", by:"Automated Monitoring Sweep", reason, ts:new Date().toISOString()});
      h.monitoringNote = reason;
      h.declineReason = reason;
      h.assignedSolution = null;
      h.assignedNote = null;
      h.status = "Solution Removed / Re-check Needed";
    }
  });
  toast(flagged
    ? `Monitoring sweep complete — ${flagged} hazard(s) flagged for re-check.`
    : `Monitoring sweep complete — no issues detected across ${resolved.length} resolved hazard(s).`);
  render();
}

function renderUploadPanel(role){

        <div id="vidPreviewWrap"></div>
        <button class="btn btn-primary" id="submitVid" disabled>Analyze Video</button>`;

      fileInput.onchange = ()=>{

        formArea.querySelector('#vidPreviewWrap').innerHTML='';
        if(f){
          const v = document.createElement('video'); v.className='preview'; v.controls=true;
          v.src = URL.createObjectURL(f);
          formArea.querySelector('#vidPreviewWrap').appendChild(v);
          submitBtn.disabled=false;
        } else submitBtn.disabled=true;

function stopMediaStream(){
  if(mediaStream){ mediaStream.getTracks().forEach(t=>t.stop()); mediaStream=null; }
}
function analyzingState(container, msg, ms, cb){
  container.innerHTML = `<div class="progress-bar"><div style="width:0%"></div></div><p style="font-size:13px;color:var(--text-dim);">${esc(msg)}</p>`;
  const bar = container.querySelector('.progress-bar > div');
  requestAnimationFrame(()=> bar.style.width='100%');
  setTimeout(cb, ms);
}
function analyzingFrames(container, cb){
  container.innerHTML = `<div class="progress-bar"><div style="width:0%"></div></div><p style="font-size:13px;color:var(--text-dim);" id="frameMsg">Analyzing frames…</p>`;
  const bar = container.querySelector('.progress-bar > div');
  const msgEl = container.querySelector('#frameMsg');
  requestAnimationFrame(()=> bar.style.width='100%');
  const msgs = ["Sampling frames…","Running detection model on sampled frames…","Aggregating hazard candidates…"];
  let i=0;
  const iv = setInterval(()=>{ if(i<msgs.length){ msgEl.textContent = msgs[i]; i++; } }, 450);
  setTimeout(()=>{ clearInterval(iv); cb(); }, 1500);
}

function runDetection(hints, mode, zone, container, isVideo){
  const combinedHint = hints.join(" ");
  let typeIds = detectFromHint(combinedHint);
  let count = 1;
  if(isVideo){ count = randInt(1,3); }
  const results = [];
  for(let i=0;i<count;i++){
    const tId = typeIds[i % typeIds.length] || pick(HAZARD_TYPES).id;
    const clipTs = isVideo ? `00:${String(randInt(3,58)).padStart(2,'0')}` : null;
    const h = buildHazard(tId, state.currentUser.role, state.currentUser.name, zone, null, false, null, null, clipTs);
    state.hazards.push(h);
    results.push(h);
  }
  saveState();
  container.innerHTML = `<p style="font-size:12.5px;color:var(--text-dim);margin-top:10px;">${results.length} hazard(s) detected and added to the queue:</p>`;
  results.forEach(h=>{
    const t = TIERS.find(x=>x.id===h.tier);
    const rc = el('div','result-card '+t.cls);
    rc.innerHTML = `
      <div class="flexrow"><span style="font-size:20px;">${h.icon}</span><b>${esc(h.label)}</b><span class="spacer"></span>${tierBadge(h.tier,h.tierNote)}</div>
      <div class="sep-bar" style="margin-top:8px;"><span>Confidence: <b>${h.confidence}%</b></span>${h.clipTimestamp?`<span>Clip timestamp: <b>${h.clipTimestamp}</b></span>`:''}<span>Zone: <b>${esc(h.zone)}</b></span></div>
      ${h.tierNote? `<p style="font-size:11.5px;color:var(--text-dim);margin:6px 0 0;">AI note: ${esc(h.tierNote)}</p>`:''}
      ${h.type==='ppe_violation' ? `<p style="font-size:11px;color:var(--text-dim);margin:6px 0 0;">Audit rule: <code>PERSON_DETECTED + NO_HELMET → PPE_VIOLATION</code></p>` : ''}
      <p style="font-size:12px;font-weight:800;color:var(--navy);margin:10px 0 2px;">Auto-suggested response</p>
      <ul class="steps-list">${h.solution.map(s=>`<li>• ${esc(s)}</li>`).join('')}</ul>
    `;
    container.appendChild(rc);
  });
  toast("Hazard added to the queue. Routed for review.");
}

function renderAssignedActions(){
  const box = el('div');
  const card = el('div','card pad');
  card.appendChild(el('div','section-title','✅ Assigned Response Actions'));
  const mine = state.hazards.filter(h=>h.uploader===state.currentUser.name && h.status!=="Resolved").sort((a,b)=>TIER_ORDER[a.tier]-TIER_ORDER[b.tier]);
  if(!mine.length){ card.appendChild(el('div','empty','No open actions assigned to you.')); box.appendChild(card); return box; }
  const tw = el('div','table-wrap');
  tw.innerHTML = `<table><thead><tr><th>Tier</th><th>Type</th><th>Location</th><th>Status</th><th>Assigned Solution</th><th></th></tr></thead><tbody>
    ${mine.map(h=>`<tr>
      <td>${tierBadge(h.tier,h.tierNote)}</td>
      <td>${h.icon} ${esc(h.label)}</td>
      <td>${esc(h.zone)}</td>
      <td>${statusBadge(h.status)}</td>
      <td>${h.assignedSolution ? esc(h.assignedSolution) : '<span style="color:var(--text-dim);">— awaiting admin —</span>'}</td>
      <td><button class="btn btn-ghost btn-sm" onclick="openHazardDetail('${h.id}')">${h.status==='Assigned' ? 'Respond →' : 'View →'}</button></td>
    </tr>`).join('')}
  </tbody></table>`;
  card.appendChild(tw);
  box.appendChild(card);
  return box;
}

/* ============================ MEMBER VIEW ============================ */
function renderMember(){
  const wrap = el('div');
  if(state.subview==="report") wrap.appendChild(renderMemberReport());
  else wrap.appendChild(renderMemberStatus());
  return wrap;
}
function renderMemberReport(){
  const box = el('div');
  const card = el('div','card pad');
  card.appendChild(el('div','section-title','🚨 Report a Hazard'));
  card.innerHTML += `
    <div class="field"><label>Zone / Location</label><select id="mZone">${ZONES.map(z=>`<option>${z}</option>`).join('')}</select></div>
    <div class="upload-tabs" id="mTabs">
      <button class="upload-tab active" data-m="text">📝 Text</button>
      <button class="upload-tab" data-m="photo">🖼️ Photo</button>
    </div>
    <div id="mFormArea"></div>
    <div id="mResult"></div>`;
  let mMode = "text";
  const formArea = card.querySelector('#mFormArea');
  const resultArea = card.querySelector('#mResult');
  function draw(){
    [...card.querySelectorAll('.upload-tab')].forEach(b=>b.classList.toggle('active', b.dataset.m===mMode));
    resultArea.innerHTML='';
    if(mMode==="text"){
      formArea.innerHTML = `<div class="field"><label>What did you see?</label><textarea id="mNote" rows="3" placeholder="e.g. worker without helmet near platform..."></textarea></div>
        <button class="btn btn-primary" id="mSubmit">Submit Report</button>`;
      formArea.querySelector('#mSubmit').onclick = ()=>{
        const note = formArea.querySelector('#mNote').value.trim();
        if(!note){ toast("Please describe what you saw."); return; }
        const zone = card.querySelector('#mZone').value;
        analyzingState(resultArea, "Analyzing report…", 700, ()=> runDetection([note], "text", zone, resultArea));
      };
    } else {
      formArea.innerHTML = `<div class="field"><label>Photo</label><input type="file" id="mPhoto" accept="image/*"></div>
        <div id="mPreview"></div>
        <button class="btn btn-primary" id="mSubmitPhoto" disabled>Submit Photo</button>`;
      const fi = formArea.querySelector('#mPhoto');
      const btn = formArea.querySelector('#mSubmitPhoto');
      fi.onchange = ()=>{
        formArea.querySelector('#mPreview').innerHTML='';
        if(fi.files[0]){
          const img = document.createElement('img'); img.className='preview'; img.src=URL.createObjectURL(fi.files[0]);
          formArea.querySelector('#mPreview').appendChild(img); btn.disabled=false;
        } else btn.disabled=true;
      };
      btn.onclick = ()=>{
        const zone = card.querySelector('#mZone').value;
        analyzingState(resultArea, "Analyzing image…", 900, ()=> runDetection([fi.files[0]?fi.files[0].name:""], "photo", zone, resultArea));
      };
    }
  }
  card.querySelectorAll('.upload-tab').forEach(b=> b.onclick = ()=>{ mMode=b.dataset.m; draw(); });
  draw();
  box.appendChild(card);
  return box;
}
function renderMemberStatus(){
  const box = el('div');
  box.appendChild(bannerEl());
  const note = el('div','card pad'); note.style.marginTop='16px';
  note.innerHTML = `<p style="font-size:13.5px;margin:0;">You'll see the overall site alert status here. For hazard details and response tracking, contact your Site Officer.</p>`;
  box.appendChild(note);
  return box;
}

/* ============================== INIT ============================== */
state = loadState();
render();
</script>
